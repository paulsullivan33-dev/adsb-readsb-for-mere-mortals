site_name: ADS-B and readsb for Mere Mortals
site_description: An aircraft tracking receiver you build yourself. How airliners broadcast their own positions on 1090 MHz, how a small program called readsb decodes those broadcasts from a cheap radio dongle, and how to prove the decoding is real with a fixture flight you generate yourself, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/adsb-readsb-for-mere-mortals/
